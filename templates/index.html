<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNMP Telemetry Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-900 min-h-screen">

<nav class="bg-gray-800 border-b border-gray-700 px-6 py-3.5 flex items-center justify-between">
  <span class="text-xl font-semibold text-white">SNMP Telemetry Agent</span>
  <span id="conn" class="bg-gray-700 text-gray-300 text-sm font-medium px-3 py-1 rounded-full">connecting…</span>
</nav>

<main class="grid grid-cols-1 lg:grid-cols-[400px_1fr] gap-5 p-6 items-start">

  <!-- Left column -->
  <div>
    <!-- Upload -->
    <div class="p-5 mb-5 bg-gray-800 border border-gray-700 rounded-lg shadow">
      <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-gray-400">Upload report</h2>

      <label for="apiKey" class="block mb-2 text-sm font-medium text-gray-300">API key (if required)</label>
      <input type="password" id="apiKey" autocomplete="off" placeholder="••••••••"
             class="mb-4 bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">

      <label for="file" class="block mb-2 text-sm font-medium text-gray-300">CSV report</label>
      <input id="file" type="file" accept=".csv"
             class="block w-full text-sm text-gray-400 border border-gray-600 rounded-lg cursor-pointer bg-gray-700 focus:outline-none file:mr-4 file:py-2.5 file:px-4 file:border-0 file:text-sm file:font-medium file:bg-gray-600 file:text-gray-200 hover:file:bg-gray-500">

      <button id="uploadBtn" type="button"
              class="mt-4 w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-800 font-medium rounded-lg text-base px-5 py-2.5">
        Upload CSV
      </button>
      <p id="uploadMsg" class="mt-3 text-sm whitespace-pre-wrap break-words hidden"></p>
    </div>

    <!-- Current file -->
    <div class="p-5 mb-5 bg-gray-800 border border-gray-700 rounded-lg shadow">
      <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-gray-400">Current file in use</h2>
      <p id="currentFile" class="font-mono text-base text-gray-100 break-all">—</p>
      <p id="fileMeta" class="mt-2 text-sm text-gray-400 whitespace-pre-line"></p>
    </div>

    <!-- Server IP -->
    <div class="p-5 bg-gray-800 border border-gray-700 rounded-lg shadow">
      <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-gray-400">Server IP</h2>
      <p id="serverIp" class="font-mono text-2xl font-semibold text-sky-400 break-all">—</p>
      <p id="serverMeta" class="mt-2 text-sm text-gray-400 whitespace-pre-line"></p>
    </div>
  </div>

  <!-- Right column: live table -->
  <div class="p-5 bg-gray-800 border border-gray-700 rounded-lg shadow">
    <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-gray-400">
      Live OID table <span id="updated" class="font-normal normal-case text-gray-500"></span>
    </h2>
    <div class="relative overflow-x-auto">
      <table class="w-full text-base text-left text-gray-300">
        <thead class="text-sm uppercase bg-gray-700 text-gray-400">
          <tr>
            <th scope="col" class="px-4 py-3">CSV metric</th>
            <th scope="col" class="px-4 py-3">OID</th>
            <th scope="col" class="px-4 py-3 text-right">Value</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
<script>
const keyInput = document.getElementById('apiKey');
keyInput.value = localStorage.getItem('apiKey') || '';
keyInput.addEventListener('change', () => localStorage.setItem('apiKey', keyInput.value));

const MSG_OK = ['text-green-400'], MSG_ERR = ['text-red-400'], MSG_MUTED = ['text-gray-400'];

function setMsg(el, text, classes) {
  el.textContent = text;
  el.classList.remove('hidden', 'text-green-400', 'text-red-400', 'text-gray-400');
  el.classList.add(...classes);
}

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const f = document.getElementById('file').files[0];
  const msg = document.getElementById('uploadMsg');
  if (!f) { setMsg(msg, 'Choose a .csv file first.', MSG_ERR); return; }
  const fd = new FormData();
  fd.append('file', f);
  const headers = {};
  if (keyInput.value) headers['X-API-Key'] = keyInput.value;
  setMsg(msg, 'Uploading…', MSG_MUTED);
  try {
    const r = await fetch('/upload', { method: 'POST', headers, body: fd });
    const d = await r.json();
    if (r.ok) {
      setMsg(msg, `Uploaded ${d.file} — ${d.metrics_loaded} metrics now served.`, MSG_OK);
      refresh();
    } else {
      setMsg(msg, d.detail || ('HTTP ' + r.status), MSG_ERR);
    }
  } catch (e) {
    setMsg(msg, String(e), MSG_ERR);
  }
});

function setConn(ok) {
  const conn = document.getElementById('conn');
  conn.classList.remove('bg-gray-700', 'text-gray-300', 'bg-green-800', 'text-green-300', 'bg-red-800', 'text-red-300');
  if (ok) { conn.textContent = 'connected'; conn.classList.add('bg-green-800', 'text-green-300'); }
  else { conn.textContent = 'disconnected'; conn.classList.add('bg-red-800', 'text-red-300'); }
}

let prev = {};
async function refresh() {
  try {
    const r = await fetch('/metrics');
    const d = await r.json();
    setConn(true);

    document.getElementById('currentFile').textContent =
      d.source_file ? d.source_file.split(/[\\/]/).pop() : '—';
    const meta = [d.count + ' metrics loaded'];
    if (d.source_file_loaded_at)
      meta.push('Loaded:   ' + new Date(d.source_file_loaded_at * 1000).toLocaleString());
    if (d.source_file_mtime)
      meta.push('Modified: ' + new Date(d.source_file_mtime * 1000).toLocaleString());
    document.getElementById('fileMeta').textContent = meta.join('\n');

    const rows = Object.entries(d.metrics).map(([name, m]) => ({ name, oid: m.oid, value: m.value }));
    rows.sort((a, b) => {
      const x = a.oid.split('.').map(Number), y = b.oid.split('.').map(Number);
      for (let i = 0; i < Math.max(x.length, y.length); i++) {
        const diff = (x[i] || 0) - (y[i] || 0);
        if (diff) return diff;
      }
      return 0;
    });

    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    for (const row of rows) {
      const changed = prev[row.oid] !== undefined && prev[row.oid] !== row.value;
      prev[row.oid] = row.value;
      const tr = document.createElement('tr');
      tr.className = 'border-b border-gray-700 hover:bg-gray-700/50';
      const tdName = document.createElement('td');
      tdName.className = 'px-4 py-2.5 font-medium text-white';
      tdName.textContent = row.name;
      const tdOid = document.createElement('td');
      tdOid.className = 'px-4 py-2.5 font-mono text-sm text-sky-400';
      tdOid.textContent = row.oid;
      const tdVal = document.createElement('td');
      tdVal.className = 'px-4 py-2.5 font-mono text-right' + (changed ? ' text-green-400' : '');
      tdVal.textContent = row.value;
      tr.append(tdName, tdOid, tdVal);
      tbody.appendChild(tr);
    }
    document.getElementById('updated').textContent = '· updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    setConn(false);
  }
}

async function fetchServer() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    const s = d.server || {};
    document.getElementById('serverIp').textContent = s.ip || '—';
    const lines = ['SNMP: udp/' + (s.snmp_port || 10161), 'host: ' + (s.hostname || '—')];
    if (s.public_ip) lines.push('public: ' + s.public_ip);
    if (s.local_ips && s.local_ips.length) lines.push('local: ' + s.local_ips.join(', '));
    if (s.ip_source === 'env') lines.push('(set via SERVER_IP env)');
    document.getElementById('serverMeta').textContent = lines.join('\n');
  } catch (e) { /* leave previous values */ }
}

fetchServer();
setInterval(fetchServer, 30000);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>

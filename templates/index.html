<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNMP Telemetry Agent</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 0.9rem 1.5rem; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.05rem; margin: 0; }
  .status { font-size: 0.85rem; color: #f87171; }
  .status.ok { color: #4ade80; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 1rem; padding: 1rem 1.5rem; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: #1e293b; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
  .card h2 { margin: 0 0 0.75rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 600; }
  td.oid { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; color: #7dd3fc; }
  td.val { font-family: ui-monospace, Consolas, monospace; text-align: right; }
  tr.changed td.val { color: #4ade80; transition: color 0.3s; }
  input[type=file], input[type=password] { width: 100%; margin-bottom: 0.6rem; font-size: 0.85rem; }
  button { background: #2563eb; color: #fff; border: 0; padding: 0.55rem 1rem; border-radius: 0.35rem; cursor: pointer; width: 100%; font-size: 0.9rem; }
  button:hover { background: #1d4ed8; }
  .msg { font-size: 0.85rem; margin-top: 0.6rem; white-space: pre-wrap; word-break: break-word; }
  .msg.ok { color: #4ade80; }
  .msg.err { color: #f87171; }
  .muted { color: #64748b; font-size: 0.82rem; }
  #currentFile { color: #e2e8f0; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>SNMP Telemetry Agent</h1>
  <span class="status" id="conn">connecting…</span>
</header>
<main>
  <section>
    <div class="card">
      <h2>Upload report</h2>
      <input type="password" id="apiKey" placeholder="API key (if required)" autocomplete="off">
      <input type="file" id="file" accept=".csv">
      <button id="uploadBtn">Upload CSV</button>
      <div class="msg" id="uploadMsg"></div>
    </div>
    <div class="card">
      <h2>Current file in use</h2>
      <div id="currentFile">—</div>
      <div id="fileMeta" class="muted"></div>
    </div>
  </section>
  <section class="card">
    <h2>Live OID table <span class="muted" id="updated"></span></h2>
    <table>
      <thead>
        <tr><th>CSV metric</th><th>OID</th><th style="text-align:right">Value</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
const keyInput = document.getElementById('apiKey');
keyInput.value = localStorage.getItem('apiKey') || '';
keyInput.addEventListener('change', () => localStorage.setItem('apiKey', keyInput.value));

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const f = document.getElementById('file').files[0];
  const msg = document.getElementById('uploadMsg');
  if (!f) { msg.className = 'msg err'; msg.textContent = 'Choose a .csv file first.'; return; }
  const fd = new FormData();
  fd.append('file', f);
  const headers = {};
  if (keyInput.value) headers['X-API-Key'] = keyInput.value;
  msg.className = 'msg muted'; msg.textContent = 'Uploading…';
  try {
    const r = await fetch('/upload', { method: 'POST', headers, body: fd });
    const d = await r.json();
    if (r.ok) {
      msg.className = 'msg ok';
      msg.textContent = `Uploaded ${d.file} — ${d.metrics_loaded} metrics now served.`;
      refresh();
    } else {
      msg.className = 'msg err';
      msg.textContent = d.detail || ('HTTP ' + r.status);
    }
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = String(e);
  }
});

let prev = {};
async function refresh() {
  try {
    const r = await fetch('/metrics');
    const d = await r.json();
    const conn = document.getElementById('conn');
    conn.textContent = 'connected';
    conn.className = 'status ok';

    document.getElementById('currentFile').textContent =
      d.source_file ? d.source_file.split(/[\\/]/).pop() : '—';
    document.getElementById('fileMeta').textContent = d.count + ' metrics loaded';

    const rows = Object.entries(d.metrics).map(([name, m]) => ({ name, oid: m.oid, value: m.value }));
    rows.sort((a, b) => {
      const x = a.oid.split('.').map(Number), y = b.oid.split('.').map(Number);
      for (let i = 0; i < Math.max(x.length, y.length); i++) {
        const diff = (x[i] || 0) - (y[i] || 0);
        if (diff) return diff;
      }
      return 0;
    });

    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    for (const row of rows) {
      const tr = document.createElement('tr');
      if (prev[row.oid] !== undefined && prev[row.oid] !== row.value) tr.className = 'changed';
      prev[row.oid] = row.value;
      const tdName = document.createElement('td');
      const tdOid = document.createElement('td');
      const tdVal = document.createElement('td');
      tdName.textContent = row.name;
      tdOid.textContent = row.oid; tdOid.className = 'oid';
      tdVal.textContent = row.value; tdVal.className = 'val';
      tr.append(tdName, tdOid, tdVal);
      tbody.appendChild(tr);
    }
    document.getElementById('updated').textContent = '· updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    const conn = document.getElementById('conn');
    conn.textContent = 'disconnected';
    conn.className = 'status';
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
